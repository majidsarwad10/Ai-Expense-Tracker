{% extends "base.html" %}
{% block title %}Edit expense · PennyPilot{% endblock %}
{% block content %}
<section class="panel narrow">
  <h1>Edit expense</h1>
  <form class="expense-form single" method="post">
    <label>Description<input name="title" maxlength="100" value="{{ expense.title }}" required></label>
    <label>Amount (₹)<input name="amount" type="number" min="0.01" step="0.01" value="{{ expense.amount }}" required></label>
    <label>Category<input name="category" value="{{ expense.category }}" required></label>
    <label>Date<input name="expense_date" type="date" value="{{ expense.expense_date }}" required></label>
    <label>Notes<input name="notes" maxlength="250" value="{{ expense.notes }}"></label>
    <button class="button" type="submit">Save changes</button>
    <a href="{{ url_for('index') }}">Cancel</a>
  </form>
</section>
{% endblock %}
