{% extends "base.html" %}
{% block title %}Dashboard · PennyPilot{% endblock %}
{% block content %}
<section class="hero">
  <div><p class="eyebrow">OVERVIEW</p><h1>Your spending dashboard</h1>
  <p class="muted">A visual summary of the expenses currently recorded.</p></div>
  <div class="total-card"><span>Transactions</span><strong>{{ expense_count }}</strong></div>
</section>
<section class="chart-grid">
  <div class="panel"><h2>Spending by category</h2><canvas id="categoryChart"></canvas></div>
  <div class="panel"><h2>Monthly spending</h2><canvas id="monthChart"></canvas></div>
</section>
<script>
window.expenseDashboard = {
  categoryLabels: {{ category_labels|tojson }},
  categoryValues: {{ category_values|tojson }},
  monthLabels: {{ month_labels|tojson }},
  monthValues: {{ month_values|tojson }}
};
</script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
{% endblock %}
